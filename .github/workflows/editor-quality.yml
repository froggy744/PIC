name: Editor image quality checks

on:
  pull_request:
    paths:
      - 'src/edit/**'
      - '.github/workflows/editor-quality.yml'
  push:
    branches:
      - feature/editor-tone-clarity-grain
    paths:
      - 'src/edit/**'
      - '.github/workflows/editor-quality.yml'

permissions:
  contents: read

jobs:
  editor:
    name: Compile and regression-test editor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK/Rust system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang mold cmake nasm pkg-config \
            libgtk-4-dev libadwaita-1-dev libsmbclient-dev libnfs-dev \
            librsvg2-common libgdk-pixbuf2.0-bin xvfb xauth
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile PIC
        run: cargo check --locked
      - name: Test editor render
        run: cargo test --locked edit::render::tests -- --test-threads=1
      - name: Test recipe compatibility and history
        run: cargo test --locked edit::model::tests -- --test-threads=1
      - name: Test creative filters
        run: cargo test --locked edit::filters::tests -- --test-threads=1
      - name: Test native preview geometry
        run: cargo test --locked native_preview_geometry_tests -- --test-threads=1
      - name: Test lightbox 1:1 recipe refresh preserves pan
        run: |
          xvfb-run -a env GSK_RENDERER=cairo cargo test --locked \
            lightbox_one_to_one_recipe_refresh_preserves_panned_viewport -- \
            --ignored --test-threads=1
