name: PIC Scrapbook skin validation

on:
  push:
    branches: [skins]
    paths:
      - 'themes/scrapbook/**'
      - 'src/css/theme_discovery.rs'
      - 'src/window/theme.rs'
      - 'src/library_home.rs'
      - 'src/library_home/**'
      - 'src/library_home_tests.rs'
      - 'src/db.rs'
      - 'src/db/scrapbook.rs'
      - 'src/window/layout.rs'
      - 'src/db/library_home.rs'
      - 'src/main.rs'
      - 'src/albums/card.rs'
      - 'src/css/base.css'
      - '.github/workflows/scrapbook-skin-check.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest visual validation; old branch pushes should not run
# several duplicate Rust builds at once.
concurrency:
  group: scrapbook-skin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrapbook:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang mold cmake nasm pkg-config \
            libgtk-4-dev libadwaita-1-dev libsmbclient-dev libnfs-dev \
            librsvg2-common libgdk-pixbuf2.0-bin xvfb xauth xdotool imagemagick \
            python3-gi gir1.2-gtk-4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format skin Rust sources for validation
        run: rustfmt --edition 2021 src/window/theme.rs src/library_home.rs src/css/theme_discovery.rs src/main.rs src/db/library_home.rs src/window/build.rs src/window/photo_actions.rs src/db.rs src/db/scrapbook.rs
      - name: Check edited Rust files compile
        run: |
          test -f themes/scrapbook/fonts/Caveat-Variable.ttf
          test -f themes/scrapbook/fonts/PatrickHand-Regular.ttf
          test -f themes/scrapbook/fonts/LICENSES.txt
      - name: Compile PIC
        run: cargo check --locked
      - name: Discover Scrapbook skin and assets
        run: cargo test --locked scrapbook_skin_is_discovered_with_all_decorative_assets -- --test-threads=1
      - name: Test scrapbook persistence and default theme discovery
        run: cargo test --locked scrapbook_detail_tests -- --test-threads=1
      - name: Validate independent Library album selection
        run: cargo test --locked scrapbook_selected_album_changes_photo_strip -- --test-threads=1
      - name: Capture real GTK scrapbook visual fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/scrapbook-visual"
          xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=cairo \
            PIC_SCRAPBOOK_SCREENSHOT_DIR="$RUNNER_TEMP/scrapbook-visual" \
            cargo test --locked scrapbook_reference_capture_layout -- --ignored --test-threads=1 --nocapture
      - name: Upload UI verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrapbook-gtk-screenshots
          path: ${{ runner.temp }}/scrapbook-visual/*.png
          if-no-files-found: ignore
      - name: Parse GTK CSS without warnings or missing assets
        run: |
          xvfb-run -a env GDK_BACKEND=x11 /usr/bin/python3 - <<'PY'
          import gi
          gi.require_version('Gtk', '4.0')
          from gi.repository import Gtk, Gio
          from pathlib import Path
          theme = Path('themes/scrapbook/theme.css')
          provider = Gtk.CssProvider()
          errors = []
          def on_error(_provider, section, error):
              errors.append(str(error))
          provider.connect('parsing-error', on_error)
          provider.load_from_path(str(theme.resolve()))
          if errors:
              raise SystemExit('GTK CSS parsing errors: ' + '\\n'.join(errors))
          assert theme.exists()
          for asset in ['paper.svg','cork.svg','washi.svg','leaves.svg',
                        'torn-gold.svg','torn-lilac.svg','torn-cream.svg',
                        'washi-pink.svg','grid-paper.svg','doodle-rays.svg',
                        'camera-sticker.svg','leaf-corner.svg','pin.svg','tape-strip.svg']:
              path = theme.parent / 'assets' / asset
              assert path.is_file(), path
          print('Scrapbook CSS and decorative SVGs load successfully')
          PY
