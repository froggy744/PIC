name: Experimental GPU Linux packaging

# Only the GPU draft PR is built. Never publish or attach binaries to releases
# from this workflow; main and the stable release workflow are untouched.
on:
  pull_request:
    branches:
      - feature/gpu-live-edit
    paths:
      - 'src/edit/**'
      - 'src/thumbnail/**'
      - 'scripts/PIC-build-linux-one-script.sh'
      - '.github/workflows/gpu-packaging-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    name: Build and smoke-test GPU AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PIC_GNOME_INTEGRATE: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang mold cmake nasm patchelf pkg-config \
            libgtk-4-dev libadwaita-1-dev libsmbclient-dev libnfs-dev \
            librsvg2-common libgdk-pixbuf2.0-bin \
            imagemagick file curl python3 xvfb xauth libgl1-mesa-dri mesa-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate packaging script
        run: bash -n scripts/PIC-build-linux-one-script.sh
      - name: Build experimental AppImage
        run: |
          printf 'yes\n' | ./scripts/PIC-build-linux-one-script.sh \
            local --appimage-only
      - name: Verify AppImage runtime and GL libraries
        run: |
          set -euo pipefail
          appimage="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -s squashfs-root/usr/lib/libpixbufloader-svg.so
          # Hardware GLVND drivers belong to the host, not to the AppImage.
          if find squashfs-root -iname '*radeonsi_dri.so' -o -iname '*nvidia*_dri.so' | grep -q .; then
            echo "::error::AppImage must not package host-specific GPU drivers."
            exit 1
          fi
          set +e
          timeout 12s xvfb-run -a env \
            GDK_BACKEND=x11 GSK_RENDERER=gl LIBGL_ALWAYS_SOFTWARE=1 \
            PIC_EDIT_RENDERER=gpu PICASA_TRACE=1 \
            HOME="$(mktemp -d)" \
            APPDIR="$PWD/squashfs-root" \
            ./squashfs-root/AppRun >/tmp/pic-package-smoke.log 2>&1
          status=$?
          set -e
          cat /tmp/pic-package-smoke.log
          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            echo "::error::AppImage startup exited unexpectedly ($status)."
            exit "$status"
          fi
          echo "AppImage started without fatal loader failures."
      - name: Save private CI test artifact (never publish)
        uses: actions/upload-artifact@v4
        with:
          name: PIC-GPU-experimental-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  flatpak:
    name: Build experimental Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PIC_GNOME_RUNTIME: "50"
      PIC_FDO_RUST_RUNTIME: "25.08"
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak flatpak-builder build-essential pkg-config \
            curl ca-certificates git python3 imagemagick \
            libglib2.0-bin appstream
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate build script
        run: bash -n scripts/PIC-build-linux-one-script.sh
      - name: Build and test experimental Flatpak
        run: |
          printf 'yes\n' | ./scripts/PIC-build-linux-one-script.sh \
            local --flatpak-only
          test -n "$(find dist -maxdepth 1 -type f -name '*.flatpak' -print -quit)"
      - name: Save private CI test artifact (never publish)
        uses: actions/upload-artifact@v4
        with:
          name: PIC-GPU-experimental-Flatpak
          path: dist/*.flatpak
          if-no-files-found: error
