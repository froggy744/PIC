name: Compact sidebar validation
on:
  push:
    branches:
      - feature/compact-sidebar-pro
  pull_request:
    paths:
      - 'src/window/layout.rs'
      - 'src/window/build.rs'
      - 'src/settings.rs'
      - 'src/css/base.css'
      - '.github/workflows/compact-sidebar-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang mold cmake nasm pkg-config \
            libgtk-4-dev libadwaita-1-dev libsmbclient-dev libnfs-dev \
            librsvg2-common libgdk-pixbuf2.0-bin xvfb xauth
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format modified Rust sources
        run: cargo fmt --all
      - name: Compact resize regression guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path("src/window/layout.rs").read_text()
          css = Path("src/css/base.css").read_text()
          drag = src.split("compact_drag.connect_drag_update(", 1)[1].split("compact_drag.connect_drag_end(", 1)[0]
          assert "split.set_max_sidebar_width(width)" in drag
          assert "split.set_min_sidebar_width(width)" not in drag, "drag must not lock the new width as a minimum"
          assert "start.set((width.get(), x, y," in src, "drag should use saved start width"
          assert "split.set_min_sidebar_width(48.0)" in src
          assert ".compact-sidebar-button" in css and "min-width: 0;" in css
          assert 'COMPACT_SIDEBAR_WIDTH_KEY' in src
          print("Compact resize static regression guards passed")
          PY
      - name: Compile check
        run: cargo check --locked
      - name: Save formatting fixes
        run: |
          git add src/window/layout.rs src/window/build.rs src/settings.rs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format compact sidebar implementation"
            git push origin HEAD:feature/compact-sidebar-pro
          fi
