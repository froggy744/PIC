name: Experimental GPU AppImage validation

# GPU draft PR: AppImage only. Flatpak is intentionally deferred.
# Run Rust/Edit/Export regression CI on normal source commits instead.
# AppImage is expensive: rebuild only after a packaging/build dependency change
# or a deliberate manual validation checkpoint (workflow_dispatch).
# Never publish or attach binaries to releases; main remains untouched.
on:
  pull_request:
    branches:
      - feature/gpu-live-edit
    paths:
      - 'scripts/PIC-build-linux-one-script.sh'
      - '.github/workflows/gpu-packaging-validation.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    name: Build and smoke-test GPU AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PIC_GNOME_INTEGRATE: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang mold cmake nasm patchelf pkg-config \
            libgtk-4-dev libadwaita-1-dev libsmbclient-dev libnfs-dev \
            librsvg2-common libgdk-pixbuf2.0-bin \
            imagemagick file curl python3 xvfb xauth libgl1-mesa-dri mesa-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate packaging script
        run: bash -n scripts/PIC-build-linux-one-script.sh
      - name: Build experimental AppImage
        run: |
          printf 'yes\n' | ./scripts/PIC-build-linux-one-script.sh \
            local --appimage-only
      - name: Verify AppImage runtime and GL libraries
        run: |
          set -euo pipefail
          appimage="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -s squashfs-root/usr/lib/libpixbufloader-svg.so
          # Hardware GLVND drivers belong to the host, not to the AppImage.
          if find squashfs-root -iname '*radeonsi_dri.so' -o -iname '*nvidia*_dri.so' | grep -q .; then
            echo "::error::AppImage must not package host-specific GPU drivers."
            exit 1
          fi
          set +e
          timeout 12s xvfb-run -a env \
            GDK_BACKEND=x11 GSK_RENDERER=gl LIBGL_ALWAYS_SOFTWARE=1 \
            PIC_EDIT_RENDERER=gpu PICASA_TRACE=1 GTK_A11Y=none \
            HOME="$(mktemp -d)" \
            APPDIR="$PWD/squashfs-root" \
            ./squashfs-root/AppRun >/tmp/pic-package-smoke.log 2>&1
          status=$?
          set -e
          cat /tmp/pic-package-smoke.log
          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            echo "::error::AppImage startup exited unexpectedly ($status)."
            exit "$status"
          fi
          # A timeout alone is not a startup pass: a broken AppRun can hang
          # before GTK creates the gallery. Require PIC's actual gallery
          # initialization trace, which the existing healthy CI run emits.
          if ! grep -Eq 'PIC_NAV gallery_replace photos=|STARTUP cold_start_ms=' /tmp/pic-package-smoke.log; then
            echo "::error::AppImage never confirmed gallery initialization."
            exit 1
          fi
          if grep -Eq 'Gtk-ERROR|GLib-GObject-CRITICAL|segmentation fault|panicked at' /tmp/pic-package-smoke.log; then
            echo "::error::AppImage emitted a fatal GTK/Rust runtime diagnostic."
            exit 1
          fi
          echo "AppImage gallery initialization confirmed under software OpenGL."
      - name: Save private CI test artifact (never publish)
        uses: actions/upload-artifact@v4
        with:
          name: PIC-GPU-experimental-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
