name: Editor image quality checks

on:
  pull_request:
    paths:
      - 'src/edit/**'
      - '.github/workflows/editor-quality.yml'
  push:
    branches:
      - feature/editor-tone-clarity-grain
    paths:
      - 'src/edit/**'
      - '.github/workflows/editor-quality.yml'

permissions:
  contents: read

jobs:
  editor:
    name: Compile and regression-test editor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK/Rust system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang mold cmake nasm pkg-config \
            libgtk-4-dev libadwaita-1-dev libsmbclient-dev libnfs-dev \
            librsvg2-common libgdk-pixbuf2.0-bin xvfb xauth \
            libgl1-mesa-dri mesa-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile PIC
        run: cargo check --locked
      - name: Test editor render
        run: cargo test --locked edit::render::tests -- --test-threads=1
      - name: Test recipe compatibility and history
        run: cargo test --locked edit::model::tests -- --test-threads=1
      - name: Test creative filters
        run: cargo test --locked edit::filters::tests -- --test-threads=1
      - name: Test native preview geometry
        run: cargo test --locked native_preview_geometry_tests -- --test-threads=1
      - name: Test lightbox 1:1 recipe refresh preserves pan
        run: |
          xvfb-run -a env GSK_RENDERER=cairo cargo test --locked \
            lightbox_one_to_one_recipe_refresh_preserves_panned_viewport -- \
            --ignored --test-threads=1
      - name: GPU OpenGL pixel parity (software GL under Xvfb)
        run: |
          xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=gl \
            LIBGL_ALWAYS_SOFTWARE=1 \
            cargo test --locked gtk_gl_area_matches_cpu_reference_at_native_pixel_size -- \
            --ignored --test-threads=1 --nocapture
      - name: GPU crop and straighten pixel parity (software OpenGL)
        run: |
          xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=gl \
            LIBGL_ALWAYS_SOFTWARE=1 \
            cargo test --locked gtk_gl_area_geometry_crop_and_straighten_match_cpu -- \
            --ignored --test-threads=1 --nocapture
      - name: GPU overlay alpha and stacking parity (software OpenGL)
        run: |
          xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=gl \
            LIBGL_ALWAYS_SOFTWARE=1 \
            cargo test --locked gtk_gl_area_layer_alpha_and_stacking_match_cpu -- \
            --ignored --test-threads=1 --nocapture
      - name: GPU filter-picker cover and creative-preset parity
        run: |
          xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=gl \
            LIBGL_ALWAYS_SOFTWARE=1 \
            cargo test --locked gtk_gl_area_filter_thumbnail_cover_matches_cpu -- \
            --ignored --test-threads=1 --nocapture
      - name: GPU full-resolution sharpness, tiny exposure and reset
        run: |
          xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=gl \
            LIBGL_ALWAYS_SOFTWARE=1 \
            cargo test --locked gtk_gl_area_full_resolution_sharpness_regression -- \
            --ignored --test-threads=1 --nocapture

  milestone-tag:
    name: Preserve hardware-tested Edit milestone tag
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/gpu-edit-pipeline'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Annotate immutable hardware-tested commit
        env:
          TAG_NAME: gpu-edit-hardware-verified-2026-10-18
          TARGET_SHA: 35b227e40633c0b38c1ce903eabd2f168121dc13
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_SHA" --depth=1
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" > /dev/null 2>&1; then
            echo "Hardware-verified tag already exists"
            exit 0
          fi
          git -c user.name='PIC release automation' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$TAG_NAME" "$TARGET_SHA" \
              -m "GPU Edit hardware test passed on Fedora RX 9070 XT; experimental milestone"
          git push origin "refs/tags/$TAG_NAME"
