name: Record GPU Edit hardware-tested milestone

on:
  push:
    branches:
      - feature/gpu-edit-pipeline
    paths:
      - .github/workflows/gpu-edit-milestone-tag.yml

permissions:
  contents: write

jobs:
  tag-hardware-tested:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable hardware-tested Edit tag
        env:
          TARGET_SHA: 35b227e40633c0b38c1ce903eabd2f168121dc13
          TAG_NAME: gpu-edit-hardware-verified-2026-10-18
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_SHA" --depth=1
          existing="$(git ls-remote --tags --refs origin "refs/tags/$TAG_NAME" || true)"
          if [ -n "$existing" ]; then
            echo "Existing milestone tag: $existing"
            test "${existing%%$'\\t'*}" = "$TARGET_SHA"
            exit 0
          fi
          git -c user.name='PIC release automation' \\
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \\
            tag -a "$TAG_NAME" "$TARGET_SHA" \\
            -m 'PIC GPU Edit hardware-verified on Fedora RX 9070 XT; draft-only, not a stable release'
          git push origin "refs/tags/$TAG_NAME"
