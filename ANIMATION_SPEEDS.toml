# ANIMATION SPEEDS
# The app reads this file from its working directory. Restart after editing.
# All values are milliseconds: smaller numbers are faster; larger are slower.
# In-place effects use 96%→100% scale and 85%→100% opacity inside final cells.
# New tiles appear immediately; rapid changes restart the effect.
# Allowed range is 16–10000 ms. Set a duration to 0 for its built-in default.

# -----------------------------------------------------------------------------
# GRID — regular Library / All Photos thumbnail grid
# -----------------------------------------------------------------------------

# Legacy Library resize duration. Used if library_resize_ms is omitted.
grid_resize_ms = 120

# Library / All Photos resize style and settle duration. The grid commits
# immediately; changed tiles ease out from 96% to full size after a 110 ms pause.
library_resize_style = "in_place"
library_resize_ms = 120

# Grid zoom presentation style: "in_place" eases changed tiles from 96% to full
# size in their final cells; "none" commits the new layout without an effect.
grid_zoom_style = "in_place"

# Duration for the grid zoom in-place effect.
grid_zoom_reflow_ms = 120

# Regular Library / All Photos mouse-wheel scrolling.
gallery_wheel_scroll_ms = 120

# -----------------------------------------------------------------------------
# FOLDERS — folder contents and column reflow, separate from the regular grid
# -----------------------------------------------------------------------------

# Folder column-count transition duration. Kept as a fallback for older configs.
folder_column_reflow_ms = 120

# Folder resize transition style and duration. The layout commits immediately;
# changed tiles ease out from 96% to full size after a 110 ms pause.
folder_column_reflow_style = "in_place"
folder_resize_style = "in_place"
folder_resize_ms = 120

# Folder zoom style: "in_place" eases changed tiles from 96% to full size in
# their final cells; "none" commits the new layout without an effect.
folder_zoom_style = "in_place"
folder_zoom_ms = 120

# Mouse-wheel scrolling while viewing folder contents.
folder_scroll_ms = 120

# Layout-settle wait before navigating to a folder after changing display mode.
folder_mode_settle_ms = 100

# -----------------------------------------------------------------------------
# SIDEBAR
# -----------------------------------------------------------------------------

# Sidebar pane expand/collapse and paired divider movement.
sidebar_slide_ms = 220

# -----------------------------------------------------------------------------
# PHOTO VIEWER
# -----------------------------------------------------------------------------

# Selected thumbnail expanding into the full photo viewer.
lightbox_open_ms = 240
