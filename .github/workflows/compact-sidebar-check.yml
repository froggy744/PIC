name: Compact sidebar validation
on:
  push:
    branches:
      - feature/compact-sidebar-pro
  pull_request:
    paths:
      - 'src/window/layout.rs'
      - 'src/window/build.rs'
      - 'src/settings.rs'
      - 'src/css/base.css'
      - '.github/workflows/compact-sidebar-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang mold cmake nasm pkg-config \
            libgtk-4-dev libadwaita-1-dev libsmbclient-dev libnfs-dev \
            librsvg2-common libgdk-pixbuf2.0-bin xvfb xauth xdotool python3-gi gir1.2-adw-1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format modified Rust sources
        run: cargo fmt --all
      - name: Compact resize regression guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path("src/window/layout.rs").read_text()
          css = Path("src/css/base.css").read_text()
          drag = src.split("sidebar_drag.connect_drag_update(", 1)[1].split("sidebar_drag.connect_drag_end(", 1)[0]
          assert "if !expanded_for_drag_update.get()" in drag
          assert "sidebar_drag_start_width_update.get() + delta" in drag
          assert "handle.compute_point(" in drag, "compact drag must use stable split coordinates"
          assert "main_split_for_drag_update.set_max_sidebar_width(width)" in drag
          assert "set_min_sidebar_width(width)" not in drag, "drag must not lock minimum width"
          assert 'let compact_dock = gtk::Overlay::new()' in src
          assert 'layout_row.append(&compact_dock)' in src
          assert 'layout_row.append(&main_split)' in src
          assert 'compact_dock.set_child(Some(&compact_sidebar_page))' in src
          assert 'dock.set_width_request(width_px.round() as i32)' in src
          assert 'dock_resize_handle.add_controller(dock_drag)' in src
          assert 'split.set_show_sidebar(show_normal && !split.is_collapsed())' in src
          assert 'COMPACT_ICON_RAIL_WIDTH: f64 = 44.0' in src
          assert 'compact-sidebar-width-v2' in src
          assert 'Some("folders-overview")' in src
          assert 'SidebarFilter::Library, folders_reveal' not in src
          assert 'sidebar_pages' not in src, "compact must never be inside Adw sidebar"
          assert "sidebar_has_visible_popover" in src, "right click must not close hover reveal"
          assert "sidebar_leave_generation" in src, "enter must cancel pending leave"
          assert ".compact-sidebar-button" in css and "min-width: 0;" in css
          assert 'COMPACT_SIDEBAR_WIDTH_KEY' in src
          print("Compact resize static regression guards passed")
          PY
      - name: X11 GTK width allocation smoke test
        run: |
          xvfb-run -a -s "-screen 0 2560x1440x24" /usr/bin/python3 - <<'PY'
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          from gi.repository import Gtk, Adw, GLib
          Adw.init()
          Gtk.Settings.get_default().set_property("gtk-enable-animations", False)
          window = Gtk.Window()
          window.set_default_size(2560, 1440)
          split = Adw.OverlaySplitView()
          split.set_min_sidebar_width(44.0)
          split.set_max_sidebar_width(44.0)
          sidebar = Gtk.Box(orientation=Gtk.Orientation.VERTICAL)
          header = Gtk.Box(orientation=Gtk.Orientation.HORIZONTAL)
          header.set_size_request(44, 46)
          heading = Gtk.Label(label="PIC")
          heading.set_hexpand(True)
          header.append(heading)
          sidebar.append(header)
          scroll = Gtk.ScrolledWindow()
          scroll.set_policy(Gtk.PolicyType.NEVER, Gtk.PolicyType.AUTOMATIC)
          entries = Gtk.Box(orientation=Gtk.Orientation.VERTICAL)
          labels = []
          icons = []
          for name in ("Library", "Photos", "Recent", "Favorites", "Ratings", "History", "Albums", "Folders", "Shared"):
              button = Gtk.Button()
              button.set_halign(Gtk.Align.FILL)
              content = Gtk.Box(orientation=Gtk.Orientation.VERTICAL)
              content.set_halign(Gtk.Align.CENTER)
              icon = Gtk.Image.new_from_icon_name("folder-symbolic")
              content.append(icon)
              icons.append(icon)
              label = Gtk.Label(label=name)
              label.set_ellipsize(3)
              label.set_visible(False)
              content.append(label)
              button.set_child(content)
              entries.append(button)
              labels.append(label)
          scroll.set_child(entries)
          sidebar.append(scroll)
          # Match PIC: normal sidebar lives in AdwOverlaySplitView, while
          # the 44px dock is an independent GtkBox sibling.
          full_page = Gtk.Box()
          full_page.set_size_request(205, -1)
          split.set_sidebar(full_page)
          split.set_content(Gtk.Box())
          split.set_show_sidebar(False)
          dock = Gtk.Overlay()
          dock.set_size_request(44, -1)
          dock.set_child(sidebar)
          layout = Gtk.Box(orientation=Gtk.Orientation.HORIZONTAL)
          layout.append(dock)
          split.set_hexpand(True)
          layout.append(split)
          window.set_child(layout)
          window.present()
          def flush():
              # Allow GTK's frame clock and libadwaita's allocation animation
              # to settle; draining only pending events does not advance frames.
              loop = GLib.MainLoop()
              GLib.timeout_add(350, loop.quit)
              loop.run()
          flush()
          for width in (44, 120, 72, 48, 160, 44):
              for label in labels:
                  label.set_visible(width >= 90)
              split.set_min_sidebar_width(44.0)
              split.set_max_sidebar_width(float(width))
              split.set_sidebar_width_fraction(float(width) / max(1.0, split.get_width()))
              dock.set_size_request(int(width), -1)
              flush()
              actual = dock.get_width()
              print(f"width={width} actual={actual} fraction={split.get_sidebar_width_fraction():.4f} max={split.get_max_sidebar_width()}", flush=True)
              assert actual <= width + 2, (width, actual)
              assert actual >= 40, (width, actual)
              assert heading.get_mapped(), "PIC heading must not disappear in compact mode"
              assert icons[0].get_mapped(), "compact icon must be mapped"
              point = icons[0].translate_coordinates(dock, 0, 0)
              assert point is not None, "icon has no drawable position"
              assert 0 <= point[0] <= actual - 8, ("icon clipped outside narrow rail", width, point, actual)
              if width < 90:
                  assert not labels[0].get_visible(), "narrow rail should hide only text"
              print(f"X11 GTK rail width request={width} actual={actual}")
          window.destroy()
          PY
      - name: Real X11 mouse drag smoke test
        run: xvfb-run -a /usr/bin/python3 tests/compact_sidebar_x11_drag.py
      - name: Compile check
        run: cargo check --locked
      - name: Save formatting fixes
        run: |
          git add src/window/layout.rs src/window/build.rs src/settings.rs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format compact sidebar implementation"
            git push origin HEAD:feature/compact-sidebar-pro
          fi
