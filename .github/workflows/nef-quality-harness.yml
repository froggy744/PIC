name: PIC Nikon RAW quality harness

on:
  push:
    branches:
      - feature/nef-raw-quality-harness
  pull_request:
    paths:
      - 'src/thumbnail.rs'
      - 'src/thumbnail/viewer.rs'
      - 'src/thumbnail/raw_quality.rs'
      - 'src/thumbnail/nef_scene.rs'
      - '.github/workflows/nef-quality-harness.yml'

permissions:
  contents: read

jobs:
  raw-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install PIC build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang mold cmake nasm pkg-config \
            libgtk-4-dev libadwaita-1-dev libsmbclient-dev libnfs-dev \
            librsvg2-common libgdk-pixbuf2.0-bin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile original PIC code
        run: cargo check --locked
      - name: Check original diagnostic invariants
        run: cargo test --locked raw_quality::tests -- --test-threads=1
      - name: Test scene-linear Nikon rendering invariants
        run: cargo test --locked nef_scene::tests -- --test-threads=1
      - name: Verify RGB16 cache, default route and Nikon Fit separation
        run: cargo test --locked nef_high_precision_cache_tests -- --test-threads=1
      - name: Verify editor preview consistency
        run: cargo test --locked edit::preview::tests -- --test-threads=1
      - name: Verify export regression tests
        run: cargo test --locked edit::export_batch::tests -- --test-threads=1
      - name: Verify Nikon ICC input handling
        run: cargo test --locked embedded_nef_jpeg_converts_wide_gamut_to_srgb_for_viewer_and_export -- --test-threads=1
