name: Build release AppImage

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  preflight:
    name: Fast AppImage preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PIC
        uses: actions/checkout@v4

      - name: Validate packaging script and resources
        run: |
          set -euo pipefail
          bash -n scripts/PIC-build-linux-one-script.sh
          test -s resources/icons.gresource
          test -s resources/icons/sidebar-hide-symbolic.svg
          test -d icon
          find icon -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.svg' \) -print -quit | grep -q .
          grep -Fq 'pic-gdk-pixbuf-query-loaders' scripts/PIC-build-linux-one-script.sh
          grep -Fq 'GDK_PIXBUF_MODULE_FILE' scripts/PIC-build-linux-one-script.sh

      - name: Install minimal SVG preflight dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libgdk-pixbuf-2.0-dev \
            libgdk-pixbuf2.0-bin librsvg2-common libglib2.0-bin

      - name: Verify isolated SVG loader path
        run: |
          set -euo pipefail

          loader="$(find /usr/lib /usr/lib64 /lib /lib64 -type f \
            -path '*/gdk-pixbuf-2.0/*/loaders/libpixbufloader-svg.so' \
            -print -quit 2>/dev/null)"
          test -n "$loader"
          test -s "$loader"

          query="$(command -v gdk-pixbuf-query-loaders || true)"
          if [[ -z "$query" ]]; then
            query="$(find /usr/lib /usr/lib64 /lib /lib64 -type f \
              -name 'gdk-pixbuf-query-loaders*' -perm -u+x \
              -print -quit 2>/dev/null)"
          fi
          test -n "$query"
          test -x "$query"

          cache="$(mktemp)"
          "$query" "$loader" > "$cache"
          test -s "$cache"
          grep -Fq "$loader" "$cache"

          cat > /tmp/pic-svg-preflight.c <<'EOF'
          #include <gdk-pixbuf/gdk-pixbuf.h>
          int main(int argc, char **argv) {
              GError *error = NULL;
              GdkPixbuf *pixbuf;
              if (argc != 2)
                  return 2;
              pixbuf = gdk_pixbuf_new_from_file(argv[1], &error);
              if (pixbuf == NULL) {
                  g_printerr("%s\n", error ? error->message : "SVG decode failed");
                  g_clear_error(&error);
                  return 1;
              }
              g_object_unref(pixbuf);
              return 0;
          }
          EOF

          cc /tmp/pic-svg-preflight.c -o /tmp/pic-svg-preflight \
            $(pkg-config --cflags --libs gdk-pixbuf-2.0)

          GDK_PIXBUF_MODULE_FILE="$cache" \
            /tmp/pic-svg-preflight resources/icons/sidebar-hide-symbolic.svg

          rm -f "$cache" /tmp/pic-svg-preflight /tmp/pic-svg-preflight.c
          echo "Fast SVG/AppImage preflight passed."

  appimage:
    name: Ubuntu 24.04 AppImage
    needs: preflight
    runs-on: ubuntu-24.04
    env:
      PIC_GNOME_INTEGRATE: "0"
    steps:
      - name: Check out PIC
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang mold cmake nasm patchelf pkg-config \
            libgtk-4-dev libadwaita-1-dev libsmbclient-dev libnfs-dev \
            librsvg2-common libgdk-pixbuf2.0-bin \
            imagemagick file curl python3 xvfb xauth

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Prepare packaging dependencies
        run: |
          printf 'yes\n' | ./scripts/PIC-build-linux-one-script.sh local --appimage-only --check-dependencies

      - name: Build catalog-compatible AppImage
        run: |
          ./scripts/PIC-build-linux-one-script.sh local --appimage-only

      - name: Verify bundled SVG icon runtime
        run: |
          set -euo pipefail
          appimage="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          rm -rf squashfs-root
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --appimage-extract >/dev/null
          test -s squashfs-root/usr/lib/libpixbufloader-svg.so
          test -x squashfs-root/usr/libexec/pic-gdk-pixbuf-query-loaders

          smoke_home="$(mktemp -d)"
          smoke_log="$(mktemp)"
          set +e
          timeout 10s xvfb-run -a env \
            HOME="$smoke_home" \
            APPDIR="$PWD/squashfs-root" \
            GTK_DEBUG=icontheme \
            GSK_RENDERER=cairo \
            LIBGL_ALWAYS_SOFTWARE=1 \
            ./squashfs-root/AppRun >"$smoke_log" 2>&1
          status=$?
          set -e
          cat "$smoke_log"

          cache_file="$smoke_home/.cache/pic-rs/gdk-pixbuf-svg-loaders.cache"
          test -s "$cache_file"
          grep -Fq "$PWD/squashfs-root/usr/lib/libpixbufloader-svg.so" "$cache_file"

          if grep -Eq 'Failed to load icon .*Unrecognized image file format|Unable to load image-loading module|could not initialize bundled SVG image loader' "$smoke_log"; then
            echo "::error::Bundled GTK SVG icon decoding failed."
            exit 1
          fi
          if ! grep -q 'looking up icon' "$smoke_log"; then
            echo "::error::PIC did not reach GTK icon lookup during the smoke test."
            exit 1
          fi
          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            echo "::error::PIC icon smoke test exited unexpectedly with status $status."
            exit "$status"
          fi
          rm -rf squashfs-root "$smoke_home" "$smoke_log"

      - name: Verify GLIBC compatibility ceiling
        run: |
          set -euo pipefail
          appimage="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --appimage-extract >/dev/null
          max="$(
            find squashfs-root -type f -print0 |
            xargs -0 -r strings 2>/dev/null |
            grep -oE 'GLIBC_[0-9]+\.[0-9]+' |
            sed 's/GLIBC_//' |
            sort -V |
            tail -n1
          )"
          echo "Highest GLIBC symbol referenced: ${max:-none}"
          if [[ -n "${max:-}" ]] && [[ "$(printf '%s\n%s\n' "$max" "2.39" | sort -V | head -n1)" == "$max" ]]; then
            echo "GLIBC compatibility check passed."
          elif [[ -z "${max:-}" ]]; then
            echo "No GLIBC version references found."
          else
            echo "::error::AppImage references GLIBC $max, newer than Ubuntu 24.04's 2.39 compatibility target."
            exit 1
          fi
          rm -rf squashfs-root

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIC-AppImage-ubuntu-24.04
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Attach AppImage to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.AppImage --clobber
